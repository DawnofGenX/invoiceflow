# InvoiceFlow — reverse proxy: /api -> backend, everything else -> frontend
#
# Upstreams are resolved through Docker's embedded DNS at request time (not just at
# startup), so a `docker compose up --build` that recreates a container with a new IP
# does not leave nginx proxying to a dead address.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream  backend:8000;
    set $frontend_upstream frontend:3000;

    # SSE + streaming must not be buffered
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend API (FastAPI)
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # keep SSE connection alive
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_read_timeout 300s;
    }
}
